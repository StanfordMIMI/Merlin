# Required. Display name of your project, as you want it listed.
name: Merlin-Super

# Required. One or two sentences, 300 characters max. Plain text, single line.
description: >
  R-Super (Report Supervision, MICCAI 2025 Best Paper runner-up) learns tumor segmentation from radiology reports. Merlin-Super is R-Super trained on Merlin Plus, surpassing public AI models for tumors in 9 organs: bladder, gallbladder, spleen, esophagus, stomach, duodenum, prostate, uterus, adrenal.

# Required. One of: model, dataset, tool, benchmark, tutorial, other
category: model

