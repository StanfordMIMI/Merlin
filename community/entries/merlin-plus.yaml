# Required. Display name of your project, as you want it listed.
name: Merlin Plus

# Required. One or two sentences, 300 characters max. Plain text, single line.
description: >
  Merlin Plus (MICCAI 2026) provides longitudinal metadata (patient IDs and scan dates) and per-voxel annotations for 44 organs and 9 tumor types in the Merlin dataset (Stanford, 25,494 CT scans). Merlin Plus allows AI models to surpass the state-of-the-art in multi-cancer detection and segmentation.

# Required. One of: model, dataset, tool, benchmark, tutorial, other
category: dataset

